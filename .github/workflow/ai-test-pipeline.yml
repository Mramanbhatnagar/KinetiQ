name: AI Production Pipeline Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-ai-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_feature_store
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Database Schema
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d ai_feature_store -f scripts/01_schema.sql

    - name: Run End-To-End Vector Search Pipeline
      env:
        DB_HOST: localhost
        DB_NAME: ai_feature_store
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_PORT: 5432
      run: |
        python ai_pipeline.py
